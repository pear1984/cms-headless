services:
  web:
    build: .
    image: cms-headless-web:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-only-change-me}"
      DEBUG: "${DEBUG:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}"
      WORDPRESS_BASE_URL: "${WORDPRESS_BASE_URL:-http://host.docker.internal:8080}"
      WORDPRESS_PUBLIC_URL: "${WORDPRESS_PUBLIC_URL:-http://localhost:8080}"
      WORDPRESS_POSTS_PER_PAGE: "${WORDPRESS_POSTS_PER_PAGE:-9}"
      WORDPRESS_API_TIMEOUT: "${WORDPRESS_API_TIMEOUT:-8}"
      WORDPRESS_CACHE_SECONDS: "${WORDPRESS_CACHE_SECONDS:-0}"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "${DJANGO_HTTP_PORT:-8001}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
