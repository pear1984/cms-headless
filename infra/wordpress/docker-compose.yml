services:
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', getenv('WORDPRESS_PUBLIC_URL') ?: 'http://localhost:8080');
        define('WP_SITEURL', getenv('WORDPRESS_PUBLIC_URL') ?: 'http://localhost:8080');
    volumes:
      - wordpress_data:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    command: >
      sh -c '
        until test -f /var/www/html/wp-config.php; do sleep 2; done;
        until wp db check --path=/var/www/html; do sleep 2; done;
        if ! wp core is-installed --path=/var/www/html; then
          wp core install --path=/var/www/html --url="$${WORDPRESS_PUBLIC_URL}" --title="$${WORDPRESS_SITE_TITLE}" --admin_user="$${WORDPRESS_ADMIN_USER}" --admin_password="$${WORDPRESS_ADMIN_PASSWORD}" --admin_email="$${WORDPRESS_ADMIN_EMAIL}" --skip-email;
        fi;
        wp rewrite structure "/%postname%/" --hard --path=/var/www/html;
      '
    restart: "no"

  db:
    image: mariadb:11.4
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    restart: unless-stopped

volumes:
  db_data:
    name: wordpress_db_data
  wordpress_data:
    name: wordpress_wordpress_data
